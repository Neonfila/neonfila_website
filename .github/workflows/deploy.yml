# Builds the Vite site and publishes dist/ to GitHub Pages on every push to main,
# and once a day so Stamp (/stamp/) serves fresh regulator data.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *" # 06:30 in Lagos

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Stamp: re-read the FCCPC, CBN and SEC registers. If any register
      # fails, shrinks suddenly, or the name tests fail, keep the committed data.
      - name: Refresh Stamp data
        continue-on-error: true
        run: |
          if node scripts/stamp/refresh.mjs --cbn-live && node --test scripts/stamp/match.test.mjs; then
            echo "Stamp data refreshed"
          else
            echo "::warning::Stamp refresh failed; deploying the committed data"
            git checkout -- public/stamp/data
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
